; Lab 5 Q2: Angular Velocity Demo
; Four capsules floating at y=4, each spinning at a different angular velocity.
; No gravity, no collision — pure angular dynamics demonstration.

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; Spin_PiHalf_X — pi/2 rad/s about X (90 deg/s, 1 full spin per 4 s)
[Entity]
[Tag]
Name = Spin_PiHalf_X
[Transform]
Position = -9 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.5
Height = 3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
AngularVelocity = 1.5708 0 0

; Spin_Pi_Y — pi rad/s about Y (180 deg/s, 1 full spin per 2 s)
[Entity]
[Tag]
Name = Spin_Pi_Y
[Transform]
Position = -3 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.5
Height = 3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
AngularVelocity = 0 3.14159 0

; Spin_3PiHalf_Z — 3pi/2 rad/s about Z (270 deg/s, 1 full spin per ~2.33 s)
[Entity]
[Tag]
Name = Spin_3PiHalf_Z
[Transform]
Position = 3 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.5
Height = 3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
AngularVelocity = 0 0 4.71239

; Spin_All_Axes — pi/2 rad/s about X, Y and Z simultaneously (precessing motion)
[Entity]
[Tag]
Name = Spin_All_Axes
[Transform]
Position = 9 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.5
Height = 3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
AngularVelocity = 1.5708 1.5708 1.5708
