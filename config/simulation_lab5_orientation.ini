; Lab 5 Q1: Angular Displacement Demo
; Six capsules, each starting upright and rotating to a different orientation.
; The angular displacement is applied live at 60 deg/s so you can watch each
; capsule rotate to its target and stop — demonstrating finite angular displacement.

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; Floor reference plane
[Entity]
[Tag]
Name = Floor_Lab5
[Transform]
Position = 0 0 0
Scale = 50 0.2 20
[MeshRenderer]
Type = procedural
Shape = Plane
Width = 50
Depth = 20
Material = Mat_Checker
[RigidBody]
Static = true
UseGravity = false
[PlaneCollider]
Normal = 0 1 0
Offset = 0

; Cap_Identity — no displacement (stays upright as a baseline reference)
[Entity]
[Tag]
Name = Cap_Identity
[Transform]
Position = -15 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.5
Height = 3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false

; Cap_90X — rotates 90 degrees about X (takes 1.5 s at 60 deg/s)
[Entity]
[Tag]
Name = Cap_90X
[Transform]
Position = -9 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.5
Height = 3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
AngularDisplacement = 90 0 0
AngularDisplacementSpeed = 60

