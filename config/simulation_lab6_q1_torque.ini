; Lab 6 Q1+Q2: Torque & Sphere Inertia Demo
; Four spheres floating at y=4, no gravity, no floor.
;
; Q1: ConstantTorque causes steady angular acceleration — each sphere spins up from rest.
; Q2: Demonstrates how mass and radius affect the moment of inertia I = (2/5)·m·r².
;   - Ref_NoTorque:     no torque → stays still (baseline reference)
;   - Sphere_Base:      m=1, r=1, τ=3 N·m → I=0.4, α = 3/0.4 = 7.5 rad/s²
;   - Sphere_HeavyMass: m=4, r=1, τ=3 N·m → I=1.6, α = 3/1.6 = 1.875 rad/s²  (4× mass → ¼ α)
;   - Sphere_BigRadius: m=1, r=2, τ=3 N·m → I=1.6, α = 3/1.6 = 1.875 rad/s²  (2× radius → 4× I → ¼ α)
; HeavyMass and BigRadius spin at the same rate (both ¼ of Base) but from different causes.

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; ---- Ref_NoTorque: baseline — no torque, no spin ----
[Entity]
[Tag]
Name = Ref_NoTorque
[Transform]
Position = -9 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 1
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
[SphereCollider]
Radius = 1

; ---- Sphere_Base: m=1, r=1, τ_y=3 N·m → α_y = 7.5 rad/s² ----
[Entity]
[Tag]
Name = Sphere_Base
[Transform]
Position = -3 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 1
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 0 3 0
[SphereCollider]
Radius = 1

; ---- Sphere_HeavyMass: m=4, r=1, τ_y=3 N·m → I=1.6, α_y = 1.875 rad/s² ----
[Entity]
[Tag]
Name = Sphere_HeavyMass
[Transform]
Position = 3 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 1
Material = Mat_Checker
[RigidBody]
Mass = 4
UseGravity = false
ConstantTorque = 0 3 0
[SphereCollider]
Radius = 1

; ---- Sphere_BigRadius: m=1, r=2, τ_y=3 N·m → I=1.6, α_y = 1.875 rad/s² ----
[Entity]
[Tag]
Name = Sphere_BigRadius
[Transform]
Position = 9 4 0
Scale = 2 2 2
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 0 3 0
[SphereCollider]
Radius = 2
