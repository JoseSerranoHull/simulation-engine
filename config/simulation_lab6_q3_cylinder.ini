; Lab 6 Q3: Cylinder Inertia Tensor Demo
; Three cylinders floating at y=4, no gravity, no floor.
; All cylinders: r=0.5, h=2.0, m=1. Same torque MAGNITUDE (5 N·m), different axes.
;
; Cylinder spin axis is local Y.
;   Iy  = (1/2)·m·r²            = 0.5 × 1 × 0.25    = 0.125  N·m·s²
;   Ixz = (1/12)·m·(3r²+h²)    = (1/12) × 1 × (0.75+4) = 0.396  N·m·s²
;
; Cyl_SpinAxis:   torque along spin axis Y → α_y = 5 / 0.125 = 40.0  rad/s²  (fast)
; Cyl_TransAxis:  torque along transverse X → α_x = 5 / 0.396 ≈ 12.6 rad/s²  (slow, ~3× less)
; Cyl_Tilted45:   rotated 45° around X before simulation starts; world-Y torque then
;                 decomposes into both body-Y and body-Z axes — demonstrates correct
;                 object-space torque conversion via invInertiaTensorWorld = R·I⁻¹·Rᵀ.

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; ---- Cyl_SpinAxis: τ along spin axis → fast spin ----
[Entity]
[Tag]
Name = Cyl_SpinAxis
[Transform]
Position = -6 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Cylinder
BottomRadius = 0.5
TopRadius = 0.5
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 0 5 0
[CylinderCollider]
Radius = 0.5
Height = 2

; ---- Cyl_TransAxis: τ along transverse axis → slow spin ----
[Entity]
[Tag]
Name = Cyl_TransAxis
[Transform]
Position = 0 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Cylinder
BottomRadius = 0.5
TopRadius = 0.5
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 5 0 0
[CylinderCollider]
Radius = 0.5
Height = 2

; ---- Cyl_Tilted45: pre-rotated 45° around X; world-Y torque splits across body axes ----
[Entity]
[Tag]
Name = Cyl_Tilted45
[Transform]
Position = 6 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Cylinder
BottomRadius = 0.5
TopRadius = 0.5
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
InitialRotation = 45 0 0
ConstantTorque = 0 5 0
[CylinderCollider]
Radius = 0.5
Height = 2
