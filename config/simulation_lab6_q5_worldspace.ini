; Lab 6 Q5: World-Space Inverse Inertia Tensor Demo
; Three cylinders floating at y=4, all receiving the SAME world-space torque: τ = (0, 5, 0).
; Only their initial orientations differ.
;
; Cylinder properties: r=0.5, h=2.0, m=1.
;   Iy  (spin axis, local Y) = 0.125  N·m·s²
;   Ixz (transverse)         = 0.396  N·m·s²
;
; The key insight: invInertiaTensorWorld = R · I_body⁻¹ · R^T  is recomputed each frame.
; The same world torque (0,5,0) produces different accelerations depending on orientation:
;
;   Cyl_Upright (0°):   local Y == world Y → torque along spin axis → α ≈ 40 rad/s²   (fast)
;   Cyl_Tilt45  (45°):  local Y tilted halfway → mixed → α intermediate
;   Cyl_Tilt90  (90°):  local Y now points along world Z → torque is transverse → α ≈ 12.6 rad/s² (slow)

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; ---- Cyl_Upright: 0° tilt — world Y aligns with spin axis → FAST ----
[Entity]
[Tag]
Name = Cyl_Upright
[Transform]
Position = -6 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Cylinder
BottomRadius = 0.5
TopRadius = 0.5
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 0 5 0
[CylinderCollider]
Radius = 0.5
Height = 2

; ---- Cyl_Tilt45: 45° around X — world Y decomposes into spin+transverse → MEDIUM ----
[Entity]
[Tag]
Name = Cyl_Tilt45
[Transform]
Position = 0 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Cylinder
BottomRadius = 0.5
TopRadius = 0.5
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
InitialRotation = 45 0 0
ConstantTorque = 0 5 0
[CylinderCollider]
Radius = 0.5
Height = 2

; ---- Cyl_Tilt90: 90° around X — local Y now points along world Z → torque is transverse → SLOW ----
[Entity]
[Tag]
Name = Cyl_Tilt90
[Transform]
Position = 6 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Cylinder
BottomRadius = 0.5
TopRadius = 0.5
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
InitialRotation = 90 0 0
ConstantTorque = 0 5 0
[CylinderCollider]
Radius = 0.5
Height = 2
