; Lab 6 Q6: Cuboid Inertia Tensor Demo
; Three boxes floating at y=4, no gravity, no floor.
;
; Cuboid inertia tensor (full extents a×b×c along local X×Y×Z, mass m):
;   Ix = (1/12)·m·(b²+c²)
;   Iy = (1/12)·m·(a²+c²)
;   Iz = (1/12)·m·(a²+b²)
;
; Box_LongAxisSpin: 0.5×0.5×2.0, τ along Z (long axis)
;   Iz = (1/12)×1×(0.25+0.25) = 0.0417 N·m·s²  → α_z = 5/0.0417 ≈ 120 rad/s²  (FAST)
;
; Box_ShortAxisSpin: same shape 0.5×0.5×2.0, τ along X (short axis)
;   Ix = (1/12)×1×(0.25+4.0)  = 0.354  N·m·s²  → α_x = 5/0.354  ≈  14 rad/s²  (SLOW)
;
; Box_Cube: 1.0×1.0×1.0, τ along X — isotropic: all axes identical
;   Ix=Iy=Iz = (1/12)×1×(1+1) = 0.167 N·m·s²   → α   = 5/0.167  ≈  30 rad/s²  (MEDIUM, same on all axes)
;
; LongAxisSpin is ~8.5× faster than ShortAxisSpin — the key observable for Q6.

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; ---- Box_LongAxisSpin: 0.5×0.5×2.0, torque along long axis Z → FAST ----
[Entity]
[Tag]
Name = Box_LongAxisSpin
[Transform]
Position = -6 4 0
Scale = 0.5 0.5 2
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.25
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 0 0 5
[BoxCollider]
Size = 0.5 0.5 2.0

; ---- Box_ShortAxisSpin: same shape 0.5×0.5×2.0, torque along short axis X → SLOW ----
[Entity]
[Tag]
Name = Box_ShortAxisSpin
[Transform]
Position = 0 4 0
Scale = 0.5 0.5 2
[MeshRenderer]
Type = procedural
Shape = Capsule
Radius = 0.25
Height = 2
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 5 0 0
[BoxCollider]
Size = 0.5 0.5 2.0

; ---- Box_Cube: 1×1×1, isotropic — same angular acceleration on any axis ----
[Entity]
[Tag]
Name = Box_Cube
[Transform]
Position = 6 4 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 0.8
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = false
ConstantTorque = 5 0 0
[BoxCollider]
Size = 1.0 1.0 1.0
