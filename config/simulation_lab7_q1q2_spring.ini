; Lab 7 Q1+Q2: Spring & Damper Demo
; Sphere_A hangs from a world anchor at (0, 8, 0) on a stiff spring.
; Sphere_B hangs below Sphere_A on a second spring — forms a two-link chain.
;
; Q1: ConstantTorque=0 demonstrates pure spring oscillation (no damping if Damping=0).
; Q2: Positive Damping causes exponential decay to equilibrium (critically/over damped with high B).
;
; Equilibrium (gravity balanced by spring):
;   Sphere_A: anchor at y=8, rest=3m, m=1 → equilibrium at y≈8-3-(mg/k)=8-3-0.49≈4.51
;   Sphere_B: hangs 2m below Sphere_A equilibrium

[Texture:White]
Path = ./textures/white.png
[Texture:Black]
Path = ./textures/black.png
[Texture:Placeholder]
Path = ./textures/matte_rough.png
[Texture:Matte]
Path = ./textures/matte_rough.png

[Material:Mat_Checker]
Pipeline = 6
CastShadows = true

; ---- Sphere_A: attached to world anchor ----
[Entity]
[Tag]
Name = Sphere_A
[Transform]
Position = 0 5 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 0.3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = true
LinearDamping = 0.998
[SphereCollider]
Radius = 0.3

; ---- Sphere_B: attached to Sphere_A ----
[Entity]
[Tag]
Name = Sphere_B
[Transform]
Position = 0 3 0
Scale = 1 1 1
[MeshRenderer]
Type = procedural
Shape = Sphere
Radius = 0.3
Material = Mat_Checker
[RigidBody]
Mass = 1
UseGravity = true
LinearDamping = 0.998
[SphereCollider]
Radius = 0.3

; Spring: world anchor (0,8,0) → Sphere_A
[Spring]
A = Sphere_A
AnchorA = 0 8 0
RestLength = 3.0
K = 20.0
Damping = 1.0

; Spring: Sphere_A → Sphere_B
[Spring]
A = Sphere_B
B = Sphere_A
RestLength = 2.0
K = 15.0
Damping = 0.8
