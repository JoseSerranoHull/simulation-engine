; Lab 7 Q3: Mass-Spring Rope Demo
; A 12-segment rope hangs from a world anchor at (0, 8, 0).
; Structural springs connect adjacent nodes; flexion springs skip one node to resist sharp bending.
;
; Expected behaviour:
;   - Chain hangs under gravity and sways realistically when disturbed.
;   - Damping (1.5) causes oscillations to decay — rope settles into a vertical line.
;   - Setting FlexionK = 0 makes the rope limper (more pendulum-like).
;   - Setting StructuralK higher (e.g., 300) reduces stretch under gravity.

