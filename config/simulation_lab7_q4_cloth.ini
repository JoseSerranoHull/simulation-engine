; Lab 7 Q4: Mass-Spring Cloth Demo
; A 6×6 grid of spheres connected by three spring types.
; Top row is pinned (isStatic = true); remaining rows hang under gravity.
;
; Spring types and their visual effect:
;   StructuralK (200): horizontal and vertical neighbours — basic cloth shape/stiffness.
;   ShearK (120):      diagonal neighbours — resists shear deformation (diagonal collapse).
;   FlexionK (60):     skip-one horizontal/vertical — resists out-of-plane bending.
;
; Set individual K values to 0 via ImGui to observe the effect of each spring type.
; Expected: without ShearK, cloth collapses into diamond shapes;
;            without FlexionK, cloth bends sharply at creases.

[Texture:White]
