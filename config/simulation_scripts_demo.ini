; ==========================================================
; SCRIPTS DEMO — GameScriptComponent system showcase
; ==========================================================
;
; Scene layout:
;   - Floor plane (static)
;   - Player sphere  (controlled by DemoPlayerScript via arrow keys / WASD)
;   - Static target  (collides solidly with player)
;   - Trigger zone   (DemoTriggerScript — isTrigger = true, no impulse)
;
; Scripts are attached in code (see GenericScenario::OnLoad or a custom scenario).
; This .ini provides the raw entity + component data;
; open the "Scripts" ImGui menu at runtime to see the live inspector.
;
; Key bindings (while cursor NOT captured):
;   Arrow / WASD   — move the Player sphere
;   Space          — jump
;   P              — pause/resume
;   F5             — restart scenario

; --- Textures ---

[Texture:White]
Path = ./textures/white.png

[Texture:Black]
Path = ./textures/black.png

[Texture:Matte]
Path = ./textures/matte_rough.png

[Texture:Placeholder]
Path = ./textures/matte_rough.png

; --- Materials ---

[Material:FloorMat]
Albedo = White
Pipeline = 6
CastShadows = false

[Material:PlayerMat]
Albedo = White
Pipeline = 6
CastShadows = true

[Material:TargetMat]
Albedo = White
Pipeline = 6
CastShadows = true

; ==========================================================
; LIGHTING
; ==========================================================

[Entity:Sun]
[Transform:Sun]
Position = 0 10 0
Rotation = 0 0 0
Scale = 1 1 1
[LightComponent:Sun]
Color = 1.0 0.95 0.85
Intensity = 1.8
IsStatic = true

; ==========================================================
; FLOOR
; ==========================================================

[Entity:Floor]
[Transform:Floor]
Position = 0 0 0
Rotation = 0 0 0
Scale    = 20 0.2 20
[Tag:Floor]
Name = Floor
[PlaneCollider:Floor]
Normal = 0 1 0
Offset = 0

; ==========================================================
; PLAYER SPHERE (DemoPlayerScript attached in code)
; ==========================================================
; Tag name "Player" is used by the scenario code to find this
; entity and attach the DemoPlayerScript after load.

[Entity:Player]
[Transform:Player]
Position = 0 3 0
Rotation = 0 0 0
Scale    = 1 1 1
[Tag:Player]
Name = Player
[SphereCollider:Player]
Radius = 0.5
; isTrigger defaults to false — solid collision
[RigidBody:Player]
Mass = 1.0
Restitution = 0.4
UseGravity = true
IsStatic = false

; ==========================================================
; STATIC TARGET SPHERE (collides solidly with player)
; ==========================================================

[Entity:Target]
[Transform:Target]
Position = 3 0.5 0
Rotation = 0 0 0
Scale    = 1 1 1
[Tag:Target]
Name = Target
[SphereCollider:Target]
Radius = 0.5
[RigidBody:Target]
Mass = 2.0
Restitution = 0.6
UseGravity = true
IsStatic = false

; ==========================================================
; TRIGGER ZONE (DemoTriggerScript attached in code)
; ==========================================================
; isTrigger = true is set in code when attaching the collider.
; A static body with no RigidBody acts as a stationary trigger volume.

[Entity:TriggerZone]
[Transform:TriggerZone]
Position = -3 0.5 0
Rotation = 0 0 0
Scale    = 1 1 1
[Tag:TriggerZone]
Name = TriggerZone
; SphereCollider with isTrigger=true is added by the scenario code
; (not expressible in .ini since isTrigger is set programmatically)
